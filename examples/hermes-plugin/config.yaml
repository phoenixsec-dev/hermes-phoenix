# Hermes profile config example for the Phoenix plugin.
# Location: ~/.hermes/config.yaml (default profile) or
# $HERMES_HOME/profiles/<name>/config.yaml.
#
# All values are synthetic placeholders. Never put secret values in this
# file: identity comes from owner-only files, and PHOENIX_TOKEN is
# intentionally unsupported at runtime.

plugins:
  enabled: [phoenix]
  entries:
    phoenix:
      # https:// because this host is not loopback: enable TLS whenever
      # requests cross a wire. Plain http:// is the supported default only
      # for loopback; non-loopback http:// draws a loud plugin warning.
      server: "https://phoenix.example:9090"
      token_file: "~/.config/phoenix/token-example-profile"
      # Optional non-step-up role: the token above only mints a scoped
      # in-memory session; runtime requests use the session token.
      role: "hermes-example-profile-runtime"
      # Needed when Phoenix uses its generated internal CA.
      ca_file: "~/.config/phoenix/ca.crt"
      default_namespace: "services/hermes/example-profile"
      timeout_seconds: 10
      # Keep false until sealed or explicitly-unsealed behavior is reviewed.
      # Server-side require_sealed policy is the authoritative control.
      enable_resolve: false
      seal_mode: true
      seal_key_file: "~/.config/phoenix/seal-example-profile.key"
      # Optional: Path A spec file; verify dry-runs its refs, and the
      # scrubber registers current env values for the names it lists.
      spec_path: "/etc/hermes/phoenix-env/example-profile.spec"
      scrub:
        enabled: true
        placeholder: "[PHOENIX-SCRUBBED:{name}]"

# Optional SecretSource block (Hermes SecretSource API v1): mapped startup
# injection for subsequently spawned Hermes processes. No plaintext disk
# cache, ever. These fetches are explicitly unsealed by contract, so give
# SecretSource paths a least-privilege identity/role without require_sealed.
secrets:
  phoenix:
    enabled: true
    env:
      EXAMPLE_CALDAV_APP_PASSWORD: "phoenix://services/hermes/example-profile/caldav-app-password"
    timeout_seconds: 20
    override_existing: false
