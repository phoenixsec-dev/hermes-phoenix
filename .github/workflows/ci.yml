name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # The offline tier. pyproject sets addopts = "-ra -m 'not integration'",
      # so the integration tier (which needs a real phoenix-server) is excluded
      # here and stays a local/release-gate concern.
      - name: Test (offline tier)
        run: python -m pytest -q

      - name: Byte-compile
        run: python -m compileall -q src scripts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Byte-compile
        run: python -m compileall -q src scripts test

      # This repo is public and ships example configs. Fail the build if an
      # operator identifier or credential-shaped string ever lands in the tree.
      - name: Secret and identifier scan
        run: |
          set -euo pipefail
          fail=0
          # Lines that visibly mark themselves as fake are allowed — test
          # fixtures legitimately contain PEM headers and dummy tokens.
          scan() {
            local label="$1" pattern="$2"
            local hits
            hits=$(git ls-files -z | xargs -0 grep -nIE "$pattern" \
              | grep -viE 'synthetic|example|placeholder|not-real|dummy|fake' || true)
            if [ -n "$hits" ]; then
              echo "::error::$label"
              echo "$hits"
              fail=1
            fi
          }
          scan "private network address" '192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+'
          scan "credential-shaped string" 'ghp_[A-Za-z0-9]{20}|sk-[A-Za-z0-9]{20}|xox[baprs]-|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{20}'
          scan "private key material" 'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY'
          if [ "$fail" -ne 0 ]; then
            echo "Scan failed. Use synthetic values in examples, docs, and tests."
            exit 1
          fi
          echo "Scan clean."
