[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-phoenix"
version = "0.1.0"
description = "Hermes plugin for Phoenix Secrets Manager"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Phoenix Project" },
]
keywords = ["hermes", "phoenix", "secrets", "plugin"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "PyNaCl>=1.5,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  # Not a runtime dependency: load_profile_snapshots() imports yaml lazily and
  # degrades to a clear PHOENIX_PROFILE_CONFIG_INVALID when it is absent, on the
  # assumption that a real Hermes install already provides it. The tests that
  # exercise that real import path (rather than injecting yaml_load) do need it.
  "PyYAML>=6,<7",
]

[project.entry-points."hermes_agent.plugins"]
phoenix = "hermes_phoenix.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: requires a real throwaway Phoenix server and is excluded from the offline tier",
]
